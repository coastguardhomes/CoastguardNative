name: Supabase Functions Deployment (disabled pending source reconciliation)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent deployment from an outdated local functions folder
        run: |
          echo "::error::Automatic deployment is disabled because the Edge Functions deployed in Supabase differ from the copies in this repository."
          echo "Reconcile and review each function against the live Supabase version before restoring deployment."
          exit 1
