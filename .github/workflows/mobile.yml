name: CoastGuard Mobile Build

on:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔥 CREA EL .env.production DENTRO DEL BUILD
      - name: Create .env.production
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35
        run: sdkmanager "platforms;android-35" "platform-tools" "build-tools;35.0.0"

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install dependencies
        run: npm install

      # ⭐ ESTE PASO ES CRÍTICO: GENERA EL BUILD WEB
      - name: Build Vite project
        run: npm run build

      # ⭐ ESTE PASO ES EL QUE FALTABA: COPIA EL BUILD WEB AL PROYECTO ANDROID
      - name: Copy web to Android
        run: npx cap copy android

      # ⭐ SINCRONIZA CAPACITOR (YA CON EL BUILD NUEVO)
      - name: Sync Capacitor
        run: npx cap sync android

      # ⭐ COMPILA EL APK REAL
      - name: Build Android APK (DEBUG)
        run: cd android && ./gradlew assembleDebug

      # ⭐ SUBE EL APK PARA DESCARGARLO
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coastguard-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
