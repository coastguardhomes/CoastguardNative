name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Instalar Node.js y dependencias del proyecto
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      # 2. Compilar la web y vincular los plugins nativos de Capacitor
      - name: Build Web App & Sync Capacitor
        run: |
          npm run build --if-present
          npx cap sync android

      # 3. Configurar entorno Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. Aceptar licencias de Android al instante (0 segundos de espera)
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n89330dbe74458c15751686d0a147c4e50fe04670\n7A93324FA990575E37CAF2F41122213A33E77C01\n4545155A7B32B1F98061F2238F8DE54409D3D1B9" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\n60100715780fe86d8a70811278d68f382a49c172" > $ANDROID_HOME/licenses/android-googletv-license

      # 5. Compilar el archivo APK de Android
      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 6. Subir el APK generado como artefacto para poder descargarlo
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
