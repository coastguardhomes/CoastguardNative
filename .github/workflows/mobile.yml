name: CoastGuard Mobile Build

on:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔥 LIMPIAR ANDROID ANTES DE GENERARLO (OBLIGATORIO)
      - name: Remove old Android folder
        run: rm -rf android

      # 🔥 NODE 24 (Vite + Capacitor funcionan perfecto)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 🔥 JAVA 21 (Gradle moderno)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 🔥 ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🔥 PLATAFORMA ANDROID 35 + BUILD TOOLS 35.0.0
      - name: Install Android SDK Platform 35
        run: sdkmanager "platforms;android-35" "platform-tools" "build-tools;35.0.0"

      # 🔥 DEPENDENCIAS EXTRA NECESARIAS PARA GRADLE
      - name: Install extra Android dependencies
        run: sdkmanager "extras;android;m2repository" "extras;google;m2repository"

      # 🔥 ACEPTAR LICENCIAS
      - name: Accept licenses
        run: yes | sdkmanager --licenses

      # 🔥 INSTALAR DEPENDENCIAS DEL PROYECTO
      - name: Install dependencies
        run: npm install

      # 🔥 COMPILAR VITE
      - name: Build Vite project
        run: npm run build

      # 🔥 GENERAR PROYECTO ANDROID
      - name: Generate Android project
        run: npx cap add android

      # 🔥 SINCRONIZAR CAPACITOR
      - name: Sync Capacitor
        run: npx cap sync android

      # 🔥 COMPILAR APK DEBUG
      - name: Build Android APK (DEBUG)
        run: cd android && ./gradlew assembleDebug

      # 🔥 SUBIR APK COMO ARTIFACTO
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coastguard-apk-debug
          path: android/app/build/outputs/apk/debug/
